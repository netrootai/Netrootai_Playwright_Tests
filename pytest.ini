[pytest]
pythonpath = .
testpaths = tests
addopts = -v --base-url=https://netrootai.com
markers =
    smoke: basic availability and sanity checks
    links: link and navigation checks
    seo: SEO and metadata checks
    responsive: viewport / layout checks
    a11y: accessibility checks
    forms: form behaviour and validation
    perf: performance budgets
    security: headers, cookies, exposed files
    content: HTML, ARIA, and embedded-content integrity checks
    resilience: graceful-degradation and resource-resilience checks
